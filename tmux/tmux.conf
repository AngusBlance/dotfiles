unbind r
bind r source-file ~/.config/tmux/tmux.conf

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key H previous-window
bind-key L next-window
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind-key p paste-buffer
unbind R
bind-key R command-prompt -I "#{window_name}" -p "Rename window:" 'rename-window -- "%%"'


set -g prefix ^B
set -g base-index 1
set -g renumber-windows on
setw -g mode-keys vi
# Make copy-mode feel like Vim visual selections
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Y send-keys -X copy-line
bind-key -T copy-mode-vi Escape send-keys -X cancel

# Enable focus events so editors reload automatically; after reloading tmux, jump between panes to confirm buffers update on focus.
set -g focus-events on
# Remove the escape-key delay so prefix sequences feel snappy; drop this if you prefer the default pause.
set -sg escape-time 0
# Keep a larger scrollback so long-running commands stay in history.
set -g history-limit 10000
set -g set-clipboard on          # use system clipboard
set -g detach-on-destroy off     # don't exit from tmux when closing a session

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-resurrect'

set -g @catppuccin_flavor 'latte'

# All @catppuccin_* customizations MUST be set before `run catppuccin.tmux`
# below. Catppuccin bakes several of these (window text among them) into
# window-status-format as literal values at the moment it runs - a plain
# `#{@catppuccin_window_text}` reference (no `E:` prefix) inside its `set -F`
# calls means "expand once, right now", not "re-evaluate live". An override
# set AFTER `run` silently changes the variable but never reaches the
# already-baked format string. (Discovered the hard way: this repo's window
# text customization looked like it worked for a long time because pane
# titles usually happen to match the process name anyway - it wasn't
# visible until a stale pane title diverged from that.)

# Keep Catppuccin's rounded status segments but swap the hard block for a curved right edge.
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_middle_separator ""
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_connect_separator "yes"
# Fast session switcher; `prefix + o` to launch SessionX.
# Keep window numbers but strip any duplicated index the shell may prepend.
# @claude_attn (set/cleared by claude/scripts/tmux-flag.sh + tmux-unflag.sh)
# shows a small dot to the left of the window name when Claude is waiting on
# you in that window, in the theme's own blue accent (@thm_blue) rather than
# a generic ANSI color, so it sits naturally in the Catppuccin palette instead
# of clashing with it. The unflagged branch keeps the single leading space
# every window normally has (Catppuccin's own default), so normal windows
# don't shift right - the tab is just briefly a couple columns wider while
# flagged. The `#[fg=...]...#[fg=#{@thm_fg}]` pair is an inline style change embedded
# directly in the text - it still renders correctly despite
# @catppuccin_window_text getting baked into window-status-format at `run`
# time (see note above), because tmux re-expands the whole assembled format
# string live at each redraw either way.
set -g @catppuccin_window_text "#{?@claude_attn, #[fg=#{@thm_blue}]● #[fg=#{@thm_fg}], }#{s/^[0-9]+ +//:#{window_name}}"
set -g @catppuccin_window_current_text "#{?@claude_attn, #[fg=#{@thm_blue}]● #[fg=#{@thm_fg}], }#{s/^[0-9]+ +//:#{window_name}}"
set -g @catppuccin_window_number "#I"
set -g @catppuccin_window_current_number "#I"
# Trim gitmux output so branches drop the prefix and only show once.
set -g @catppuccin_gitmux_text ' #(~/.config/tmux/scripts/gitmux-status.sh "#{pane_current_path}")'
# Plainer git-branch glyph instead of Catppuccin's default (looks too much like a GitHub logo).
set -g @catppuccin_gitmux_icon ' '

# Clear the @claude_attn flag the instant you switch to that window - "lights
# up until clicked on". pane-focus-in looks like the more fitting hook for
# this but is a silent no-op on this tmux version; after-select-window is
# what actually fires. No explicit -t here: unlike display-message, this
# version's set-window-option doesn't expand a "#{window_id}" target string
# (fails "no such window") - omitting -t targets the window this hook just
# made current, which is exactly the one we want. (tmux-unflag.sh, wired to
# UserPromptSubmit, also clears it when you reply - both paths keep this in
# sync either way.)
set-hook -g after-select-window 'set-window-option @claude_attn 0'
# after-select-window only fires for switching windows WITHIN a session -
# switching sessions entirely (e.g. via the tmux-sessionx binding above)
# doesn't touch it. client-session-changed covers that: it fires with the
# newly-current window of the session you just switched to as context, so
# the same no-target trick clears the right one.
set-hook -g client-session-changed 'set-window-option @claude_attn 0'

# Load Catppuccin theme files - must come AFTER all @catppuccin_* overrides above.
run '~/.config/tmux/plugins/catppuccin/catppuccin.tmux'

set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-bind 'o'
set -g @sessionx-custom-path '~/opal'
# status bar
set -g status-justify left
set -g status-position top
# Keep tmux auto-naming windows by the active command so Catppuccin shows something meaningful.
set -g automatic-rename on
set -g automatic-rename-format "#{b:pane_current_command}"
set -g status-style "bg=#{@thm_bg}"
set -g status-left ""
set -g status-right "#(~/.config/tmux/scripts/short-path.sh \"#{pane_current_path}\") #{E:@catppuccin_status_gitmux}"
set -g status-right-length 120
# Ensure terminal advertises true-colour support inside tmux
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',wezterm:RGB'

run '~/.config/tmux/plugins/tpm/tpm'
