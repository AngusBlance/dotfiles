unbind r
bind r source-file ~/.config/tmux/tmux.conf

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key H previous-window
bind-key L next-window
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind-key p paste-buffer
unbind R
bind-key R command-prompt -I "#{window_name}" -p "Rename window:" 'rename-window -- "%%"'


set -g prefix ^B
set -g base-index 1
set -g renumber-windows on
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Y send-keys -X copy-line
bind-key -T copy-mode-vi Escape send-keys -X cancel

set -g focus-events on
set -sg escape-time 0
set -g history-limit 10000
set -g set-clipboard on
set -g detach-on-destroy off

set -g @plugin 'tmux-plugins/tpm'
# Declared here (not a manual `run`) so tpm's clean (prefix M-u) keeps it.
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-resurrect'

set -g @catppuccin_flavor 'latte'

# @catppuccin_* overrides must come before tpm's `run` line (tpm loads
# catppuccin) - it bakes some of them (window text included) in as literal
# values when it runs.
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_middle_separator ""
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_connect_separator "yes"
# No bar strip: pills float on the terminal background.
set -g @catppuccin_status_background "none"

# One accent (mauve) marks "you are here": the current window. The session
# pill stays muted and only turns red while the prefix key is held.
# Everything else stays in muted overlay/subtext tones.
# subtext_0 keeps the pale number readable (3.7:1; overlay_0 was 2:1).
set -g @catppuccin_window_number_color "#{@thm_subtext_0}"
set -g @catppuccin_window_text_color "default"
set -g @catppuccin_window_current_number_color "#{@thm_mauve}"
set -g @catppuccin_window_current_text_color "#{@thm_surface_0}"
# Icons render as blank squares at this size, so pills are text only. The
# session keeps a one-cell tab that blends in and turns red on prefix.
set -g @catppuccin_session_icon " "
# Long names are cut to 24 chars so the gap before the window list survives.
set -g @catppuccin_session_text "#{=/24/…:session_name} "
set -g @catppuccin_session_color "#{?client_prefix,#{E:@thm_red},#{E:@thm_surface_0}}"
set -g @catppuccin_directory_icon ""
set -g @catppuccin_directory_text " #{s|^$HOME|~|:pane_current_path} "
set -g @catppuccin_gitmux_icon ""

# @claude_attn (claude/scripts/tmux-flag.sh + tmux-unflag.sh) shows a blue dot
# when Claude is waiting on you in that window. Inactive names are dimmed,
# the current one is bold, and a zoomed window gets a trailing Z.
# A leading "N " is stripped only from automatic names (where a shell may
# prepend the index); a window you renamed, e.g. "2024 notes", is left alone.
set -g @_window_name "#{?automatic-rename,#{s/^[0-9]+ +//:#{window_name}},#{window_name}}#{?window_zoomed_flag, Z,}"
set -g @catppuccin_window_text "#{?@claude_attn, #[fg=#{@thm_blue}]● , }#[fg=#{@thm_subtext_0}]#{E:@_window_name}"
set -g @catppuccin_window_current_text "#{?@claude_attn, #[fg=#{@thm_blue}]● , }#[fg=#{@thm_fg},bold]#{E:@_window_name}#[nobold]"
set -g @catppuccin_window_number "#I"
set -g @catppuccin_window_current_number "#I"

# Clears @claude_attn on window switch / session switch respectively. No -t:
# this tmux's set-window-option doesn't expand a "#{window_id}" string target
# (fails "no such window") - omitting -t just targets the current window.
set-hook -g after-select-window 'set-window-option @claude_attn 0'
set-hook -g client-session-changed 'set-window-option @claude_attn 0'

# Sessions started with a bare `tmux` get a number (0, 1, ...), which says
# nothing in the status bar. Name them after the folder they started in
# (name-session.sh adds -2, -3 if the name is taken). A session you name with
# a bare number yourself (-s 42) is renamed too; tmux can't tell them apart.
set-hook -g session-created 'if -F "#{m/r:^[0-9]+$,#{session_name}}" "run-shell -b \"~/.config/tmux/scripts/name-session.sh #{q:session_id} #{q:pane_current_path}\""'

set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-bind 'o'
set -g @sessionx-custom-path '~/opal'
# status bar
set -g status-justify left
set -g status-position top
# Second, empty status line gives a blank row between the bar and the pane.
set -g status 2
set -g status-format[1] ""
set -g automatic-rename on
# Claude Code's process title is its version (e.g. 2.1.270); show "claude".
set -g automatic-rename-format "#{?#{m/r:^[0-9]+[.][0-9]+[.][0-9]+$,#{pane_current_command}},claude,#{b:pane_current_command}}"
set -g status-left "#{E:@catppuccin_status_session}#[bg=default]  "
set -g status-left-length 40
# gitmux pill only renders inside a git repo. bg=default keeps the gap between
# the path and git pills from inheriting the path pill's background.
set -g status-right "#{E:@catppuccin_status_directory}#{?#{!=:#(~/.config/tmux/scripts/gitmux-status.sh \"#{pane_current_path}\"),},#[bg=default]  #{E:@catppuccin_status_gitmux},}"
set -g status-right-length 120
# Refresh path/git every 5s instead of the default 15s.
set -g status-interval 5
set -g default-terminal "tmux-256color"
# Full value (not -a): appending duplicated these on every reload.
set -s terminal-overrides 'linux*:AX@,alacritty:RGB,wezterm:RGB'

run '~/.config/tmux/plugins/tpm/tpm'

# The gitmux module overwrites its text (no -o) when catppuccin runs, so this
# has to come after tpm loads it.
set -g @catppuccin_gitmux_text ' #(~/.config/tmux/scripts/gitmux-status.sh "#{pane_current_path}") '

# A window list with one entry is noise: only show it when the session has more
# than one window. Wraps the formats catppuccin just built.
set -gF @_window_format "#{window-status-format}"
set -gF @_window_current_format "#{window-status-current-format}"
set -g window-status-format "#{?#{e|>:#{session_windows},1},#{E:@_window_format},}"
set -g window-status-current-format "#{?#{e|>:#{session_windows},1},#{E:@_window_current_format},}"
