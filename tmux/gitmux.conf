# Catppuccin-styled gitmux config, read by scripts/gitmux-status.sh; reload tmux to apply
# See https://github.com/catppuccin/tmux/docs/reference/status-line.md#gitmux

tmux:
  styles:
    clear: "#[fg=#{@thm_fg}]"
    state: "#[fg=#{@thm_red},bold]"
    branch: "#[fg=#{@thm_fg},bold]"
    remote: "#[fg=#{@thm_teal}]"
    divergence: "#[fg=#{@thm_fg}]"
    staged: "#[fg=#{@thm_green},bold]"
    conflict: "#[fg=#{@thm_red},bold]"
    modified: "#[fg=#{@thm_yellow},bold]"
    untracked: "#[fg=#{@thm_subtext_0},bold]"
    stashed: "#[fg=#{@thm_blue},bold]"
    clean: "#[fg=#{@thm_rosewater},bold]"
    insertions: "#[fg=#{@thm_green}]"
    deletions: "#[fg=#{@thm_red}]"
  layout:
    - branch
    - divergence
    - " - "
    - flags
  options:
    branch_max_len: 28
    branch_trim: center
    ellipsis: "..."
