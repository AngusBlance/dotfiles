import = ["~/.config/alacritty/cappuccin-latte.toml"]
live_config_reload = true
shell = { program = "/bin/zsh" }

[window]
padding = {x = 10, y = 10}
opacity = 1
startup_mode = "Maximized"

[scrolling]
history = 10000
multiplier = 3

[font]
normal = { family = "JetBrainsMono Nerd Font" }
size = 12
offset = {x = 0, y = 0}
glyph_offset = {x=0, y=0}

[selection]
save_to_clipboard = true

[cursor]
style = {shape = "Block", blinking = "Always"}
blink_interval = 750
thickness = 0.15

[terminal]
osc52 = "CopyPaste"

[mouse]
hide_when_typing = false

[hints]

[keyboard]
bindings = [{key = "v", mods = "Alt", action = "ToggleViMode"}]

[debug]
# render_timer = true
