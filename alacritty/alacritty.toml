
[window]
padding = {x = 18, y = 4}
dynamic_padding = true
decorations = "Buttonless"
opacity = 1
startup_mode = "Maximized"

[scrolling]
history = 10000
multiplier = 3

[font]
normal = { family = "JetBrainsMono Nerd Font" }
size = 12
offset = {x = 0, y = 0}
glyph_offset = {x=0, y=0}

[selection]
save_to_clipboard = true

[cursor]
style = {shape = "Block", blinking = "Off"}

[terminal]
osc52 = "CopyPaste"
shell = { program = "/bin/zsh", args = ["-l"] }

[mouse]
hide_when_typing = false

[hints]

[keyboard]
bindings = [{key = "v", mods = "Alt", action = "ToggleViMode"}]

[debug]

[general]
live_config_reload = true
import = ["~/.config/alacritty/cappuccin-latte.toml"]
# render_timer = true
